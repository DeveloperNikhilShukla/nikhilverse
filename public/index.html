<script>
/* =========================================================
   NIKHILVERSE HERO CAROUSEL
   FIRST 5 LATEST UPLOADS
   ========================================================= */

(async function loadHeroCarousel() {

  const carousel = document.getElementById("heroCarousel");
  const dotsBox = document.getElementById("heroDots");
  const prevBtn = document.getElementById("heroPrev");
  const nextBtn = document.getElementById("heroNext");

  if (!carousel) return;

  try {

    const response = await fetch("/api/videos");

    const videos = await response.json();

    /*
      API ke first 5 videos = latest 5 uploads
    */

    const latest = videos
      .filter(v => v.thumbnail && v.youtube_id)
      .slice(0, 5);

    if (!latest.length) {
      carousel.style.display = "none";
      return;
    }

    let current = 0;
    let timer;

    /* Create Slides */

    carousel.innerHTML = latest.map((video, index) => {

      const safeTitle =
        (video.title || "NIKHILVERSE")
          .replace(/"/g, "&quot;");

      return `
        <div
          class="hero-slide ${index === 0 ? "active" : ""}"
          data-index="${index}"
          onclick="window.open(
            'https://www.youtube.com/watch?v=${video.youtube_id}',
            '_blank'
          )"
        >

          <img
            src="${video.thumbnail}"
            alt="${safeTitle}"
            loading="${index === 0 ? "eager" : "lazy"}"
          >

          <div class="hero-slide-title">
            ${safeTitle}
          </div>

        </div>
      `;

    }).join("");


    /* Create Dots */

    dotsBox.innerHTML = latest.map((_, index) => `
      <button
        class="hero-dot ${index === 0 ? "active" : ""}"
        data-index="${index}"
        aria-label="Go to slide ${index + 1}"
      ></button>
    `).join("");


    const slides =
      Array.from(
        carousel.querySelectorAll(".hero-slide")
      );

    const dots =
      Array.from(
        dotsBox.querySelectorAll(".hero-dot")
      );


    /* Show Slide */

    function showSlide(index) {

      current =
        (index + slides.length) %
        slides.length;

      slides.forEach((slide, i) => {

        slide.classList.toggle(
          "active",
          i === current
        );

      });

      dots.forEach((dot, i) => {

        dot.classList.toggle(
          "active",
          i === current
        );

      });

    }


    /* Next */

    function nextSlide() {

      showSlide(current + 1);

    }


    /* Previous */

    function previousSlide() {

      showSlide(current - 1);

    }


    /* Buttons */

    nextBtn.addEventListener(
      "click",
      function(e) {

        e.stopPropagation();

        nextSlide();

        restartTimer();

      }
    );


    prevBtn.addEventListener(
      "click",
      function(e) {

        e.stopPropagation();

        previousSlide();

        restartTimer();

      }
    );


    /* Dots */

    dots.forEach((dot, index) => {

      dot.addEventListener(
        "click",
        function(e) {

          e.stopPropagation();

          showSlide(index);

          restartTimer();

        }
      );

    });


    /* Auto Play */

    function startTimer() {

      timer = setInterval(
        nextSlide,
        5000
      );

    }


    function restartTimer() {

      clearInterval(timer);

      startTimer();

    }


    startTimer();


    /* Pause when mouse is over */

    carousel.addEventListener(
      "mouseenter",
      function() {

        clearInterval(timer);

      }
    );


    carousel.addEventListener(
      "mouseleave",
      function() {

        startTimer();

      }
    );


  } catch (error) {

    console.error(
      "Hero carousel error:",
      error
    );

  }

})();
</script>

<script src="/app.js"></script>
