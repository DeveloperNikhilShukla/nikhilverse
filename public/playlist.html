<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NIKHILVERSE — Playlist</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050912;color:#eef6ff;font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}
a{color:inherit;text-decoration:none}
.header{position:sticky;top:0;z-index:20;background:rgba(5,9,18,.94);backdrop-filter:blur(14px);border-bottom:1px solid #17263a}.nav{max-width:1400px;margin:auto;min-height:68px;display:flex;align-items:center;gap:24px;padding:10px 22px}.logo{font-weight:900;letter-spacing:2px;font-size:22px}.logo span{color:#25a7ff}.links{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:#9fb3ca}.links a:hover{color:#fff}.back{margin-left:auto;border:1px solid #294766;background:#0b1726;border-radius:10px;padding:10px 14px;color:#fff;cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:24px 22px 60px}.crumb{color:#7590ac;font-size:13px;margin-bottom:15px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px}.playerbox{background:#07111e;border:1px solid #1a3149;border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35)}.player{position:relative;aspect-ratio:16/9;background:#000}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.info{padding:20px}.title{font-size:25px;line-height:1.25;font-weight:800;margin-bottom:10px}.meta{display:flex;gap:10px;flex-wrap:wrap;color:#86a1bc;font-size:13px}.description{margin-top:18px;color:#b9c8d8;white-space:pre-wrap;line-height:1.6;font-size:14px}.side{background:#07111e;border:1px solid #1a3149;border-radius:16px;overflow:hidden;height:fit-content;position:sticky;top:88px}.sidehead{padding:18px;border-bottom:1px solid #172b41}.sidehead h2{margin:0;font-size:17px}.sidehead small{display:block;color:#6f89a5;margin-top:6px}.list{max-height:calc(100vh - 180px);overflow:auto}.item{display:flex;gap:12px;padding:12px;border-bottom:1px solid #122236;cursor:pointer}.item:hover{background:#0b1b2d}.item.active{background:#102a43;box-shadow:inset 3px 0 #2ca9ff}.thumb{width:125px;height:70px;object-fit:cover;border-radius:8px;background:#02060b;flex:0 0 auto}.ititle{font-size:13px;line-height:1.4;font-weight:700;color:#eaf3fb}.num{font-size:11px;color:#66809b;margin-bottom:5px}.empty,.loading{padding:30px;color:#8198b0;text-align:center}.hero{background:linear-gradient(135deg,#0a1a2b,#07101d);border:1px solid #19334e;border-radius:16px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:32px}.hero p{margin:0;color:#9bb0c5;line-height:1.6;max-width:900px}.count{display:inline-block;margin-top:14px;color:#59b8ff;font-size:13px}.error{color:#ff9898}.footer{text-align:center;border-top:1px solid #15253a;padding:25px;color:#627b95;font-size:12px;margin-top:30px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static}.list{max-height:500px}.links{display:none}}
@media(max-width:600px){.nav{padding:10px 14px}.wrap{padding:18px 14px 40px}.title{font-size:20px}.hero h1{font-size:25px}.item{padding:10px}.thumb{width:105px;height:60px}}
</style>
</head>
<body>
<header class="header"><nav class="nav"><a class="logo" href="/"><span>NIKHIL</span>VERSE</a><div class="links"><a href="/">Home</a><a href="/#videos">Movies</a><a href="/#documentaries">Documentaries</a><a href="/#scifi">Sci-Fi</a><a href="/#shows">TV Shows</a></div><button class="back" onclick="location.href='/'">← Back</button></nav></header>
<main class="wrap">
<div class="crumb"><a href="/">NIKHILVERSE</a> / YouTube Playlist</div>
<section class="hero"><h1 id="playlistTitle">Loading playlist…</h1><p id="playlistDescription"></p><span class="count" id="playlistCount"></span></section>
<div class="layout">
<section class="playerbox"><div class="player"><iframe id="player" src="about:blank" title="NIKHILVERSE YouTube player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="info"><div class="title" id="videoTitle">Select a video</div><div class="meta"><span id="videoChannel"></span><span id="videoPosition"></span></div><div class="description" id="videoDescription"></div></div></section>
<aside class="side"><div class="sidehead"><h2>Videos in this Playlist</h2><small id="sideCount">Loading…</small></div><div class="list" id="videoList"><div class="loading">Loading videos…</div></div></aside>
</div>
<div class="footer">© NIKHILVERSE • Internal playlist player</div>
</main>
<script>
(function(){
 const params=new URLSearchParams(location.search); const playlistId=params.get('id');
 const title=document.getElementById('playlistTitle'), desc=document.getElementById('playlistDescription'), count=document.getElementById('playlistCount'), sideCount=document.getElementById('sideCount'), list=document.getElementById('videoList'), player=document.getElementById('player'), videoTitle=document.getElementById('videoTitle'), videoChannel=document.getElementById('videoChannel'), videoPosition=document.getElementById('videoPosition'), videoDescription=document.getElementById('videoDescription');
 let videos=[];
 if(!playlistId){showError('Playlist ID missing.');return;}
 function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
 function showError(msg){title.textContent='Unable to load playlist';desc.innerHTML='<span class="error">'+esc(msg)+'</span>';list.innerHTML='<div class="empty error">'+esc(msg)+'</div>'}
 function selectVideo(index,autoplay){const v=videos[index];if(!v)return; document.querySelectorAll('.item').forEach((x,i)=>x.classList.toggle('active',i===index)); player.src='https://www.youtube.com/embed/'+encodeURIComponent(v.id)+'?rel=0'+(autoplay?'&autoplay=1':''); videoTitle.textContent=v.title||'Untitled video'; videoChannel.textContent=v.channelTitle||''; videoPosition.textContent='Video '+(index+1)+' of '+videos.length; videoDescription.textContent=v.description||'No description available.'; if(innerWidth<901)window.scrollTo({top:0,behavior:'smooth'});}
 async function load(){try{const r=await fetch('/api/playlist?id='+encodeURIComponent(playlistId));const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'Playlist unavailable');const p=data.playlist||{};videos=Array.isArray(data.videos)?data.videos:[];title.textContent=p.title||'Playlist';desc.textContent=p.description||'Explore this playlist inside NIKHILVERSE.';count.textContent=(videos.length||0)+' videos'+(p.channelTitle?' • '+p.channelTitle:'');sideCount.textContent=videos.length+' videos';if(!videos.length){list.innerHTML='<div class="empty">No playable public videos found in this playlist.</div>';return;}list.innerHTML=videos.map((v,i)=>'<div class="item" data-index="'+i+'"><img class="thumb" src="'+esc(v.thumbnail)+'" alt="" loading="lazy"><div><div class="num">#'+(i+1)+'</div><div class="ititle">'+esc(v.title)+'</div></div></div>').join('');document.querySelectorAll('.item').forEach(x=>x.addEventListener('click',()=>selectVideo(Number(x.dataset.index),true)));selectVideo(0,false)}catch(e){console.error(e);showError(e.message)}}
 load();
})();
</script>
</body>
</html>
